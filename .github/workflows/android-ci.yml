name: Android CI

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: aas2-source-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-test:
    name: Source validation, unit tests and debug compile (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests only
        run: gradle :app:testDebugUnitTest

      # Build-only validation: this creates a debug APK and Android test APK,
      # but does not sign/publish a release or execute device tests.
      - name: Compile debug app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      # Publish a private, installable debug APK artifact before emulator tests.
      # This lets the user test the current app even if a later device test fails.
      - name: Calculate debug APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          echo "Debug APK: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable debug APK
        id: upload-debug-apk
        continue-on-error: true
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: Ali-Aboudy-Scholars-2-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify checked-in Room schema exports
        run: |
          schema_dir=app/schemas/com.asimalimikial.aas2.data.AppDatabase
          for version in 1 2; do
            schema="$schema_dir/$version.json"
            test -s "$schema"
            git ls-files --error-unmatch "$schema" >/dev/null
            git diff --exit-code -- "$schema"
          done
          echo "Room schema v1 and v2 exports match the checked-in schemas."

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests on API 35 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest

      # If GitHub artifact storage is full, keep CI tests running and store
      # the APK on a private orphan branch. This does not touch main or publish a Release.
      - name: Publish APK to a private delivery branch when artifact upload is unavailable
        if: ${{ always() && steps.upload-debug-apk.outcome == 'failure' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/foundation/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          APK_BYTES="$(stat -c '%s' "$APK_PATH")"
          if [ "$APK_BYTES" -ge 95000000 ]; then
            echo "APK exceeds the safe GitHub single-file limit: $APK_BYTES bytes."
            exit 1
          fi
          DELIVERY_BRANCH="delivery/apk-debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          DELIVERY_DIR="$RUNNER_TEMP/aas2-apk-delivery"
          mkdir -p "$DELIVERY_DIR"
          cp "$APK_PATH" "$DELIVERY_DIR/Ali-Aboudy-Scholars-2-v0.1.0-debug.apk"
          (
            cd "$DELIVERY_DIR"
            git init -b "$DELIVERY_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            sha256sum *.apk > SHA256SUMS.txt
            cat > README.txt <<EOF
Ali & Aboudy Scholars 2
Build type: Debug (not a Release)
versionName: 0.1.0
versionCode: 1
applicationId: com.asimalikial.aas2
Source commit: ${GITHUB_SHA}
Android CI run: ${GITHUB_RUN_ID}
APK bytes: ${APK_BYTES}
EOF
            git add .
            git commit -m "Deliver private debug APK for device testing"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${DELIVERY_BRANCH}"
          )
          APK_SHA="$(sha256sum "$DELIVERY_DIR/Ali-Aboudy-Scholars-2-v0.1.0-debug.apk" | awk '{print $1}')"
          DOWNLOAD_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DELIVERY_BRANCH}/Ali-Aboudy-Scholars-2-v0.1.0-debug.apk"
          {
            echo "### Private Debug APK delivery"
            echo "- Branch: \`${DELIVERY_BRANCH}\`"
            echo "- APK size: ${APK_BYTES} bytes"
            echo "- SHA-256: \`${APK_SHA}\`"
            echo "- Download URL: ${DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Instrumentation runs on an API 35 emulator. Physical-device acceptance
      # on the family's Android handset remains a separate QA gate.
