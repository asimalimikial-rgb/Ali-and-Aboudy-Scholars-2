name: Android CI

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - main
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: aas2-source-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Source validation, unit tests and debug compile (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests only
        run: gradle :app:testDebugUnitTest

      # Build-only validation: this creates a debug APK and Android test APK,
      # but does not sign/publish a release or execute device tests.
      - name: Compile debug app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      # Validate the debug APK locally; the dedicated build workflow is the only
      # workflow that stores/delivers an installable APK artifact.
      - name: Calculate debug APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          echo "Debug APK compiled successfully: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify checked-in Room schema exports
        run: |
          schema_dir=app/schemas/com.asimalimikial.aas2.data.AppDatabase
          for version in 1 2; do
            schema="$schema_dir/$version.json"
            test -s "$schema"
            git ls-files --error-unmatch "$schema" >/dev/null
            git diff --exit-code -- "$schema"
          done
          echo "Room schema v1 and v2 exports match the checked-in schemas."

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests on API 35 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest

      # Instrumentation runs on an API 35 emulator. Physical-device acceptance
      # on the family's Android handset remains a separate QA gate.
