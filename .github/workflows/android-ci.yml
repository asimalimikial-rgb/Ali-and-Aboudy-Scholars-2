name: Android CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Verify Room schema export
        run: |
          find app/schemas -maxdepth 3 -type f -print
          test -s app/schemas/com.asimalimikial.aas2.data.AppDatabase/1.json

      - name: Run database instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              echo "::group::Android emulator diagnostics"
              adb devices -l || true
              echo "---- Relevant logcat (AndroidRuntime / instrumentation / runner / Room / SQLite) ----"
              adb logcat -d -v time 2>&1 | grep -Ei 'AndroidRuntime|FATAL EXCEPTION|Process:|Instrumentation|TestRunner|AndroidJUnitRunner|Room|SQLite|crash|exception|fatal' | tail -n 400 || true
              echo "---- Instrumentation result files ----"
              find app/build/outputs/androidTest-results/connected app/build/reports/androidTests/connected -type f -maxdepth 6 -print 2>/dev/null || true
              echo "---- XML test result excerpts ----"
              find app/build/outputs/androidTest-results/connected -type f -name '*.xml' -print -exec sed -n '1,240p' {} \; 2>/dev/null || true
              echo "---- Emulator and instrumentation processes ----"
              adb shell getprop sys.boot_completed 2>/dev/null || true
              adb shell ps -A 2>/dev/null | grep -Ei 'instrument|test|aas2' || true
              echo "::endgroup::"
            fi
            exit "$test_status"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scholars2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
