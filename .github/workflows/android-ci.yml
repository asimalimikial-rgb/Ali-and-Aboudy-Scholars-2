name: Android CI

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - main
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: aas2-source-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Source validation, unit tests and debug compile (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests only
        run: gradle :app:testDebugUnitTest

      # Build-only validation: this creates a debug APK and Android test APK,
      # but does not sign/publish a release or execute device tests.
      - name: Compile debug app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      # Validate the debug APK locally; the dedicated build workflow is the only
      # workflow that stores/delivers an installable APK artifact.
      - name: Calculate debug APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          echo "Debug APK compiled successfully: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify checked-in Room schema exports
        run: |
          schema_dir=app/schemas/com.asimalimikial.aas2.data.AppDatabase
          for version in 1 2; do
            schema="$schema_dir/$version.json"
            test -s "$schema"
            git ls-files --error-unmatch "$schema" >/dev/null
            git diff --exit-code -- "$schema"
          done
          echo "Room schema v1 and v2 exports match the checked-in schemas."

      - name: Enable KVM for Android emulator
        if: github.event_name != 'push'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests on API 35 emulator
        if: github.event_name != 'push'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest

      # Instrumentation runs on an API 35 emulator. Physical-device acceptance
      # on the family's Android handset remains a separate QA gate.

  publish-debug-preview:
    name: Publish tested Android debug pre-release
    needs: verify-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/foundation/slice-0-android'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build verified debug APK
        run: gradle :app:assembleDebug

      - name: Create GitHub pre-release with APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_BYTES="$(stat -c '%s' "$APK")"
          if [ "$APK_BYTES" -ge 95000000 ]; then
            echo "APK exceeds the safe GitHub single-file limit: $APK_BYTES bytes."
            exit 1
          fi

          VERSION_NAME="$(awk -F '"' '/versionName/ {print $2; exit}' app/build.gradle.kts)"
          VERSION_CODE="$(awk -F '=' '/versionCode/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' app/build.gradle.kts)"
          [[ "$VERSION_NAME" =~ ^[0-9]+(\\.[0-9]+){2}$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          echo "Resolved app version: ${VERSION_NAME} (${VERSION_CODE})"

          TAG="v${VERSION_NAME}-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "Release tag: ${TAG}"
          ASSET="Ali-Aboudy-Scholars-2-${TAG}.apk"
          cp "$APK" "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          APK_SHA="$(awk '{print $1}' "${ASSET}.sha256")"

          NOTES="$RUNNER_TEMP/aas2-release-notes.md"
          cat > "$NOTES" <<EOF
          ## Ali & Aboudy Scholars 2 — ${TAG}

          This is a **debug pre-release for personal device testing**, not a production-signed release.

          - App version: ${VERSION_NAME} (${VERSION_CODE})
          - Package ID: com.asimalimikial.aas2
          - Source branch: foundation/slice-0-android
          - Source commit: ${GITHUB_SHA}
          - APK size: ${APK_BYTES} bytes
          - SHA-256: ${APK_SHA}

          Automated gates passed before publication: JVM unit tests, debug and Android test APK compilation, Room schema verification, and Android instrumentation tests on an API 35 emulator.

          Physical-device acceptance remains a separate check. Debug builds may require uninstalling a previous debug build before installation if its signing certificate differs.
          EOF

          gh release create "$TAG" \
            "$ASSET#Download AAS2 Android APK" \
            "${ASSET}.sha256#SHA-256 checksum" \
            --target "$GITHUB_SHA" \
            --title "Ali & Aboudy Scholars 2 ${TAG}" \
            --notes-file "$NOTES" \
            --prerelease

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          {
            echo "### Android pre-release published"
            echo "- Release: ${RELEASE_URL}"
            echo "- APK: ${ASSET}"
            echo "- Size: ${APK_BYTES} bytes"
            echo "- SHA-256: ${APK_SHA}"
            echo "- Source commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
