name: Android CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aas2-source-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Source validation and unit tests (no APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests only
        run: gradle :app:testDebugUnitTest

      - name: Verify checked-in Room schema export
        run: |
          schema=app/schemas/com.asimalimikial.aas2.data.AppDatabase/1.json
          test -s "$schema"
          git ls-files --error-unmatch "$schema" >/dev/null
          git diff --exit-code -- "$schema"
          echo "Room schema export matches the checked-in schema."

      # APK assembly, APK upload, and emulator instrumentation are intentionally
      # disabled during the source-development phase. Instrumentation tests
      # build/install test APKs and will be re-enabled only after explicit
      # approval to enter device/emulator validation.
