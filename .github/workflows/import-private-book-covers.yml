name: Import private offline textbook covers

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - "tools/book-covers/**"
      - ".github/workflows/import-private-book-covers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aas2-private-book-covers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned image validator
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - name: Download and validate all seven book covers
        run: python tools/book-covers/import-private-covers.py
      - name: Commit local offline covers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/book-covers
          if git diff --cached --quiet; then
            echo "All personal-use book cover assets are already current."
          else
            git commit -m "assets: add private offline textbook covers"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
