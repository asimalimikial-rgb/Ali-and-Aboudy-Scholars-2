name: Content validation

on:
  push:
    branches:
      - main
      - foundation/slice-0-android
    paths:
      - "content/catalog/**"
      - "content/staging/**"
      - "tools/content/**"
      - "docs/**"
      - ".github/workflows/content-validation.yml"
  pull_request:
    paths:
      - "content/catalog/**"
      - "content/staging/**"
      - "tools/content/**"
      - "docs/**"
      - ".github/workflows/content-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    name: Validate seven-book catalog and reviewed staging content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate catalog, review patch and media checksums
        run: node tools/content/validate-staging-content.mjs
      - name: Validate new book-completion draft sets
        run: |
          node tools/content/validate-kg2-book-coverage.mjs
          node tools/content/validate-grade2-book-coverage.mjs
          node tools/content/validate-science-book-coverage.mjs
          node tools/content/validate-kg2-guided-practice.mjs
          node tools/content/validate-science-units-3-5-drafts.mjs
          node tools/content/validate-english-world-drafts.mjs
          node tools/content/validate-mathematics-book-drafts.mjs
      - name: Check web application JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/sw.js
