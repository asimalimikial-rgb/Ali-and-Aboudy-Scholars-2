name: AAS2 APK delivery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aas2-apk-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BYTES="$(stat -c '%s' "$APK")"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$BYTES" -lt 95000000
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK size: $BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK to a dedicated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_BYTES: ${{ steps.verify.outputs.bytes }}
          APK_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          BRANCH="delivery/apk-debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          DIR="$RUNNER_TEMP/aas2-delivery"
          mkdir -p "$DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$DIR/Ali-Aboudy-Scholars-2-debug.apk"
          cd "$DIR"
          git init -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha256sum *.apk > SHA256SUMS.txt
          printf '%s\n' "Ali & Aboudy Scholars 2" "Debug APK for device testing; not a production-signed release." "Version: 0.1.0 (1)" "Application ID: com.asimalimikial.aas2" "Source branch: ${GITHUB_REF_NAME}" "Source commit: ${GITHUB_SHA}" "Workflow run: ${GITHUB_RUN_ID}" "APK bytes: ${APK_BYTES}" "SHA-256: ${APK_SHA}" > README.txt
          git add .
          git commit -m "Deliver AAS2 debug APK"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "Download: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/Ali-Aboudy-Scholars-2-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: ${APK_SHA}" >> "$GITHUB_STEP_SUMMARY"

# Workflow activation commit: execute on the next foundation branch push.
