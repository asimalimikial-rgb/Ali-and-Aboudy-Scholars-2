name: Publish Android debug preview release

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the exact CI-validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Prepare preview APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE_APK"
          mkdir -p release-assets
          cp "$SOURCE_APK" "release-assets/Ali-Aboudy-Scholar-0.2.0-preview.1.apk"
          cd release-assets
          sha256sum "Ali-Aboudy-Scholar-0.2.0-preview.1.apk" > "Ali-Aboudy-Scholar-0.2.0-preview.1.apk.sha256"
          cat "Ali-Aboudy-Scholar-0.2.0-preview.1.apk.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish installable debug preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-preview.1
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Ali & Aboudy Scholar 0.2.0 Preview 1
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            ## Ali & Aboudy Scholar 0.1.1 — Preview 1

            - Installable Android **debug APK** for personal device testing.
            - Source commit passed Android CI, including JVM tests, Debug and AndroidTest compilation, Room schema checks, and API 35 emulator instrumentation.
            - Application ID: com.asimalimikial.aas2.
            - App version: 0.2.0 (versionCode 3).

            **Important:** This is a debug preview, not a production-signed release. Production signing configuration is unchanged and no signing secrets are included.
          files: |
            release-assets/Ali-Aboudy-Scholar-0.2.0-preview.1.apk
            release-assets/Ali-Aboudy-Scholar-0.2.0-preview.1.apk.sha256
