name: Build installable debug APK

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aas2-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish private debug APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          echo "APK size: $(stat -c '%s' "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ali-Aboudy-Scholars-2-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
