name: Build and deliver AAS2 debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aas2-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deliver:
    name: Build, verify and publish installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and calculate checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_BYTES="$(stat -c '%s' "$APK")"
          if [ "$APK_BYTES" -ge 95000000 ]; then
            echo "APK exceeds the safe GitHub single-file limit: $APK_BYTES bytes."
            exit 1
          fi
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "APK size: $APK_BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $APK_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK on a dedicated delivery branch (no Actions artifact)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_BYTES: ${{ steps.verify.outputs.apk_bytes }}
          APK_SHA: ${{ steps.verify.outputs.apk_sha }}
        run: |
          set -euo pipefail
          DELIVERY_BRANCH="delivery/apk-debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          DELIVERY_DIR="$RUNNER_TEMP/aas2-apk-delivery"
          mkdir -p "$DELIVERY_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$DELIVERY_DIR/Ali-Aboudy-Scholars-2-debug.apk"
          (
            cd "$DELIVERY_DIR"
            git init -b "$DELIVERY_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            sha256sum *.apk > SHA256SUMS.txt
            cat > README.txt <<EOF
Ali & Aboudy Scholars 2
Build type: Debug APK for device testing (not a signed production release)
versionName: 0.1.0
versionCode: 1
applicationId: com.asimalimikial.aas2
Source branch: ${GITHUB_REF_NAME}
Source commit: ${GITHUB_SHA}
Workflow run: ${GITHUB_RUN_ID}
APK bytes: ${APK_BYTES}
SHA-256: ${APK_SHA}
EOF
            git add .
            git commit -m "Deliver verified AAS2 debug APK"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${DELIVERY_BRANCH}"
          )
          DOWNLOAD_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DELIVERY_BRANCH}/Ali-Aboudy-Scholars-2-debug.apk"
          {
            echo "### APK delivery"
            echo "- Delivery branch: ${DELIVERY_BRANCH}"
            echo "- APK size: ${APK_BYTES} bytes"
            echo "- SHA-256: ${APK_SHA}"
            echo "- Download URL: ${DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep only the two newest APK delivery branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t OLD_BRANCHES < <(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              | jq -r '[.[][]? | .name | select(startswith("delivery/apk-debug-")) | {name: ., run: ((capture("delivery/apk-debug-(?<run>[0-9]+)-").run) | tonumber)}] | sort_by(.run) | reverse | .[2:] | .[].name'
          )
          for branch in "${OLD_BRANCHES[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Removed older APK delivery branch: ${branch}"
          done
