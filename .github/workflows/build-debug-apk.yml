name: Build and deliver AAS2 debug APK

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aas2-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deliver:
    name: Build, verify and publish installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and calculate checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_BYTES="$(stat -c '%s' "$APK")"
          if [ "$APK_BYTES" -ge 95000000 ]; then
            echo "APK exceeds the safe GitHub single-file limit: $APK_BYTES bytes."
            exit 1
          fi
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "APK size: $APK_BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $APK_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ali-Aboudy-Scholars-2-v0.2.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK on a dedicated delivery branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_BYTES: ${{ steps.verify.outputs.apk_bytes }}
          APK_SHA: ${{ steps.verify.outputs.apk_sha }}
        run: |
          set -euo pipefail
          DELIVERY_BRANCH="delivery/apk-debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          DELIVERY_DIR="$RUNNER_TEMP/aas2-apk-delivery"
          mkdir -p "$DELIVERY_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$DELIVERY_DIR/Ali-Aboudy-Scholars-2-v0.2.0-debug.apk"
          printf '%s\n' \
            "Ali & Aboudy Scholars 2" \
            "Build type: Debug APK for device testing (not a production-signed release)" \
            "versionName: 0.2.0" \
            "versionCode: 3" \
            "applicationId: com.asimalimikial.aas2" \
            "Source branch: ${GITHUB_REF_NAME}" \
            "Source commit: ${GITHUB_SHA}" \
            "Workflow run: ${GITHUB_RUN_ID}" \
            "APK bytes: ${APK_BYTES}" \
            "SHA-256: ${APK_SHA}" > "$DELIVERY_DIR/README.txt"
          printf '%s  %s\n' "$APK_SHA" "Ali-Aboudy-Scholars-2-v0.2.0-debug.apk" > "$DELIVERY_DIR/SHA256SUMS.txt"
          (
            cd "$DELIVERY_DIR"
            git init -b "$DELIVERY_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Deliver verified AAS2 debug APK"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${DELIVERY_BRANCH}"
          )
          DOWNLOAD_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DELIVERY_BRANCH}/Ali-Aboudy-Scholars-2-v0.2.0-debug.apk"
          echo "### APK delivery" >> "$GITHUB_STEP_SUMMARY"
          echo "- Delivery branch: ${DELIVERY_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct download: ${DOWNLOAD_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: ${APK_SHA}" >> "$GITHUB_STEP_SUMMARY"
