name: Build installable debug APK

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aas2-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and deliver installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Purge previous AAS2 debug APK artifacts before building
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARTIFACT_IDS < <(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              | jq -r '[.[] | .artifacts[]?] | .[] | select(.name | startswith("Ali-Aboudy-Scholars-2-debug-")) | .id'
          )
          echo "Found ${#ARTIFACT_IDS[@]} previous AAS2 debug APK artifacts."
          for artifact_id in "${ARTIFACT_IDS[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            echo "Deleted AAS2 debug APK artifact: ${artifact_id}"
          done
          echo "Previous AAS2 debug APK artifacts purged; only this run may upload a new APK."

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          echo "APK size: $(stat -c '%s' "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        id: upload-debug-apk
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Ali-Aboudy-Scholars-2-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Deliver APK through a dedicated branch if artifact storage is unavailable
        if: ${{ always() && steps.upload-debug-apk.outcome == 'failure' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/foundation/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          APK_BYTES="$(stat -c '%s' "$APK_PATH")"
          if [ "$APK_BYTES" -ge 95000000 ]; then
            echo "APK exceeds the safe GitHub single-file limit: $APK_BYTES bytes."
            exit 1
          fi
          DELIVERY_BRANCH="delivery/apk-debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          DELIVERY_DIR="$RUNNER_TEMP/aas2-apk-delivery"
          mkdir -p "$DELIVERY_DIR"
          cp "$APK_PATH" "$DELIVERY_DIR/Ali-Aboudy-Scholars-2-debug.apk"
          (
            cd "$DELIVERY_DIR"
            git init -b "$DELIVERY_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            sha256sum *.apk > SHA256SUMS.txt
            cat > README.txt <<EOF
Ali & Aboudy Scholars 2
Build type: Debug (not a Release)
versionName: 0.1.0
versionCode: 1
applicationId: com.asimalikial.aas2
Source commit: ${GITHUB_SHA}
Android CI run: ${GITHUB_RUN_ID}
APK bytes: ${APK_BYTES}
EOF
            git add .
            git commit -m "Deliver debug APK for device testing"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${DELIVERY_BRANCH}"
          )
          APK_SHA="$(sha256sum "$DELIVERY_DIR/Ali-Aboudy-Scholars-2-debug.apk" | awk '{print $1}')"
          DOWNLOAD_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DELIVERY_BRANCH}/Ali-Aboudy-Scholars-2-debug.apk"
          {
            echo "### Debug APK delivery"
            echo "- Branch: ${DELIVERY_BRANCH}"
            echo "- APK size: ${APK_BYTES} bytes"
            echo "- SHA-256: ${APK_SHA}"
            echo "- Download URL: ${DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
